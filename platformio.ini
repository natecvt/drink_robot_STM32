; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nucleo_f446re

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
framework = stm32cube
upload_protocol = stlink
upload_flags = -c set CPUAPID 0x2ba01477
build_src_filter = +<*> -<EWARM>
build_flags = 
	-Isrc/Core/Inc
	-Itest/include
	-I.pio/libdeps/native/Unity/src
	-u_printf_float
build_type = debug
lib_deps = throwtheswitch/Unity@^2.6.1

[env:native]
platform = native
build_type = test
test_framework = unity
test_build_src = yes
build_src_filter = 
	+<lib/button.c>
	+<lib/ringbuf.c>
build_flags = 
	-DTESTING
	-Isrc/Core/Inc
	-Itest/include
	-I.pio/libdeps/native/Unity/src
lib_deps = throwtheswitch/Unity@^2.6.1
